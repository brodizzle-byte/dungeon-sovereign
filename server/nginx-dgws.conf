# Drop this location into the juicebox server block (the :443 one).
#
# Lockstep is a latency problem, not a throughput one: every buffer and
# timeout below exists to stop nginx from holding a 40-byte input packet
# for even a few milliseconds, or from hanging up on an idle-looking
# socket in the middle of a long match.

location /dgws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    # the websocket upgrade itself
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    # Never buffer: an input packet that sits in nginx is input delay every
    # player in the match has to absorb.
    proxy_buffering off;
    tcp_nodelay on;

    # A match can run for many minutes with only tiny packets. The default
    # 60s read timeout would drop a slow lobby mid-fight.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}
